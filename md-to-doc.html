</head>
<body class="bg-gray-50 text-gray-900 font-sans">
    <header class="bg-white shadow-sm">

                    <option value="word">导出为Word</option>
                    <option value="excel">导出为Excel</option>
                </select>
                <button id="export-btn" class="px-4 py-2 bg-primary text-white rounded-md hover:bg-primary/90 transition-all flex items-center space-x-2 disabled:opacity-50 disabled:cursor-not-allowed">
                    <i class="fa fa-download"></i>
                    <span>导出</span>
                </button>
            </div>
        </div>
    </header>
    
    <main class="container mx-auto px-4 py-6">
        <div class="mb-4 p-3 bg-blue-50 border border-blue-200 rounded-md flex items-center space-x-2">
            <i class="fa fa-info-circle text-primary"></i>
            <p class="text-sm text-gray-700">
                <span class="font-medium">提示：</span>Word导出完整文档，Excel仅导出表格
            </p>
        </div>
        
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">
                <div class="p-3 bg-gray-50 border-b border-gray-200 flex items-center justify-between">
                    <h2 class="font-medium text-gray-700 flex items-center space-x-2">
                        <i class="fa fa-edit text-gray-500"></i>
                        <span>Markdown编辑器</span>
                    </h2>
                    <div class="flex items-center space-x-2">
                        <button id="clear-btn" class="text-sm text-gray-500 hover:text-gray-700 transition-all">

                <div class="editor-container">
                    <textarea id="markdown-input" class="w-full h-full p-4 font-mono text-sm resize-none outline-none scrollbar-thin" placeholder="请输入Markdown内容..."></textarea>
                </div>
            </div>
            
            <div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">
                <div class="p-3 bg-gray-50 border-b border-gray-200 flex items-center justify-between">

                            <i class="fa fa-table"></i>
                            <span class="ml-1 hidden sm:inline">表格视图</span>

                <div class="preview-container p-4 overflow-auto scrollbar-thin">

            </div>
        </div>
        
        <div class="mt-8 bg-white rounded-lg shadow-sm border border-gray-200 p-6">
            <h2 class="text-xl font-semibold text-gray-800 mb-4">功能说明</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <h3 class="text-lg font-medium text-gray-700 mb-2 flex items-center">
                        <i class="fa fa-magic text-primary mr-2"></i>

                    </h3>

                        根据内容自动识别导出格式，有表格推荐Excel，否则导出Word。
                    </p>

                        Word导出
                    </h3>
                    <p class="text-gray-600">
                        将Markdown转换为Word文档，保留标题、列表、代码等格式。

    <footer class="bg-white border-t border-gray-200 mt-8">
        <div class="container mx-auto px-4 py-6">

                <p>© 2025 YKChengZi Markdown转换器</p>
            </div>

    <script>
        const markdownInput = document.getElementById('markdown-input');
        const markdownPreview = document.getElementById('markdown-preview');
        const tablePreview = document.getElementById('table-preview');
        const exportBtn = document.getElementById('export-btn');
        const formatSelect = document.getElementById('format-select');
        const clearBtn = document.getElementById('clear-btn');
        const sampleBtn = document.getElementById('sample-btn');
        const previewModeToggle = document.getElementById('preview-mode-toggle');
        
        const sampleMarkdown = `# Markdown示例文档

## 标题和段落

这是一个**粗体**文本，这是一个*斜体*文本。

这是一个[链接](https://example.com)。

## 列表

- 项目1
- 项目2
- 项目3

1. 第一步
2. 第二步
3. 第三步

## 代码块

\`\`\`javascript
function hello() {
    console.log("Hello, world!");
}
\`\`\`

## 表格

| 姓名 | 年龄 | 城市 |
|------|------|------|
| 张三 | 25 | 北京 |
| 李四 | 30 | 上海 |

## 引用

> 这是一段引用文本。

---

感谢使用！
> Made By Bili_YKChengZi`;
        
        function init() {
            marked.setOptions({
                breaks: true,
                gfm: true,
                headerIds: true,
                mangle: false
            });
            
            markdownInput.addEventListener('input', handleMarkdownInput);
            exportBtn.addEventListener('click', handleExport);
            clearBtn.addEventListener('click', handleClear);
            sampleBtn.addEventListener('click', handleSample);
            previewModeToggle.addEventListener('click', handlePreviewModeToggle);
            
            renderMarkdown();
            checkForTables();
        }
        
        function handleMarkdownInput() {
            renderMarkdown();
            checkForTables();
        }
        
        function renderMarkdown() {
            const markdown = markdownInput.value.trim();
            
            if (markdown === '') {
                markdownPreview.innerHTML = '<div class="text-center text-gray-400 mt-12"><i class="fa fa-file-text-o text-4xl mb-3"></i><p>请在左侧输入Markdown内容</p></div>';
                exportBtn.disabled = true;
                return;
            }
            
            exportBtn.disabled = false;
            const html = marked.parse(markdown);
            const sanitizedHtml = DOMPurify.sanitize(html);
            markdownPreview.innerHTML = sanitizedHtml;
            renderTablePreview(markdown);
        }
        
        function renderTablePreview(markdown) {
            const tables = extractTables(markdown);
            
            if (tables.length === 0) {
                tablePreview.innerHTML = '<div class="text-center text-gray-400 mt-12"><i class="fa fa-table text-4xl mb-3"></i><p>未检测到表格内容</p></div>';
                return;
            }
            
            let html = '<div class="space-y-6">';
            tables.forEach((table, index) => {
                html += `
                    <div class="bg-white p-4 rounded-lg border border-gray-200">
                        <h3 class="text-lg font-medium text-gray-700 mb-3">表格 ${index + 1}</h3>
                        <div class="overflow-x-auto">
                            ${table}
                        </div>
                    </div>
                `;
            });
            html += '</div>';
            tablePreview.innerHTML = html;
        }
        
        function extractTables(markdown) {
            const tableRegex = /\|.*\|(?:\r?\n\|.*\|)+/g;
            const tables = [];
            let match;
            while ((match = tableRegex.exec(markdown)) !== null) {
                const html = marked.parse(match[0]);
                tables.push(html);
            }
            return tables;
        }
        
        function checkForTables() {
            const markdown = markdownInput.value.trim();
            const hasTables = /\|.*\|(?:\r?\n\|.*\|)+/.test(markdown);
            
            if (hasTables) {
                previewModeToggle.classList.remove('hidden');
            } else {
                previewModeToggle.classList.add('hidden');
                markdownPreview.classList.remove('hidden');
                tablePreview.classList.add('hidden');
            }
        }
        
        function handleExport() {
            const markdown = markdownInput.value.trim();
            
            if (markdown === '') {
                alert('请输入Markdown内容');
                return;
            }
            
            const selectedFormat = formatSelect.value;
            if (selectedFormat === 'excel') {
                exportToExcel(markdown);
            } else {
                exportToWord(markdown);
            }
        }
        
        function exportToExcel(markdown) {
            try {
                const tables = extractTablesFromMarkdown(markdown);
                
                if (tables.length === 0) {
                    alert('未检测到表格内容');
                    return;
                }
                
                const wb = XLSX.utils.book_new();
                tables.forEach((table, index) => {
                    const ws = XLSX.utils.aoa_to_sheet(table);
                    XLSX.utils.book_append_sheet(wb, ws, `Sheet${index + 1}`);
                });
                
                XLSX.writeFile(wb, 'markdown-to-excel.xlsx');
            } catch (error) {
                console.error('导出Excel失败:', error);
                alert('导出Excel失败，请重试');
            }
        }
        
        function extractTablesFromMarkdown(markdown) {
            const tableRegex = /\|.*\|(?:\r?\n\|.*\|)+/g;
            const tables = [];
            let match;
            while ((match = tableRegex.exec(markdown)) !== null) {
                const rows = match[0].split('\n');
                const tableData = rows.map(row => {
                    const cells = row.trim().replace(/^\||\|$/g, '').split('|');
                    return cells.map(cell => cell.trim());
                }).filter((row, index) => {
                    if (index === 0) return true;
                    return !row.every(cell => /^-+$/.test(cell));
                });
                tables.push(tableData);
            }
            return tables;
        }
        
        function exportToWord(markdown) {
            try {
                const html = marked.parse(markdown);
                const styledHtml = `
                    <!DOCTYPE html>
                    <html>
                    <head>
                        <meta charset="UTF-8">
                        <style>
                            body { font-family: Arial, sans-serif; line-height: 1.6; }
                            h1 { font-size: 24pt; font-weight: bold; margin-bottom: 12pt; }
                            h2 { font-size: 18pt; font-weight: bold; margin-top: 18pt; margin-bottom: 10pt; }
                            h3 { font-size: 14pt; font-weight: bold; margin-top: 14pt; margin-bottom: 8pt; }
                            p { margin-bottom: 10pt; }
                            ul, ol { margin-bottom: 10pt; padding-left: 20pt; }
                            code { font-family: Consolas, monospace; background-color: #f5f5f5; padding: 2pt 4pt; border-radius: 3pt; }
                            pre { background-color: #f5f5f5; padding: 10pt; border-radius: 5pt; overflow-x: auto; }
                            table { border-collapse: collapse; width: 100%; margin-bottom: 10pt; }
                            th, td { border: 1px solid #ddd; padding: 6pt; text-align: left; }
                            th { background-color: #f2f2f2; font-weight: bold; }
                            blockquote { border-left: 4px solid #ddd; padding-left: 10pt; color: #666; font-style: italic; }
                        </style>
                    </head>
                    <body>
                        ${html}
                    </body>
                    </html>
                `;
                
                const blob = htmlDocx.asBlob(styledHtml);
                saveAs(blob, 'markdown-to-word.docx');
            } catch (error) {
                console.error('导出Word失败:', error);
                alert('导出Word失败，请重试');
            }
        }
        
        function handleClear() {
            if (markdownInput.value.trim() === '') return;
            if (confirm('确定要清空吗？')) {
                markdownInput.value = '';
                renderMarkdown();
                checkForTables();
            }
        }
        
        function handleSample() {
            if (confirm('加载示例内容？')) {
                markdownInput.value = sampleMarkdown;
                handleMarkdownInput();
            }
        }
        
        function handlePreviewModeToggle() {
            const icon = previewModeToggle.querySelector('i');
            if (markdownPreview.classList.contains('hidden')) {
                markdownPreview.classList.remove('hidden');
                tablePreview.classList.add('hidden');
                icon.classList.remove('fa-file-text-o');
                icon.classList.add('fa-table');
                previewModeToggle.querySelector('span').textContent = '表格视图';
            } else {
                markdownPreview.classList.add('hidden');
                tablePreview.classList.remove('hidden');
                icon.classList.remove('fa-table');
                icon.classList.add('fa-file-text-o');
                previewModeToggle.querySelector('span').textContent = '文档视图';
            }
        }
        
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body></html>
